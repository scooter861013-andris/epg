name: Rossz JSON frissites

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rossz-json
  cancel-in-progress: false

jobs:
  frissites:
    runs-on: ubuntu-latest
    steps:
      - name: Repo letoltese
        uses: actions/checkout@v4
      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fuggosegek
        run: python -m pip install requests beautifulsoup4
      - name: Hajdu Bihar lista feldolgozasa
        run: python scripts/rossz.py
      - name: JSON mentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rossz.json
          if git diff --cached --quiet; then
            echo "Nincs valtozas."
          else
            git commit -m "Rossz JSON frissites"
            git push
          fi
