name: Hirdetesek JSON frissites

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'A listázó oldal HTTPS címe'
        required: true
        default: 'https://rosszlanyok.hu/varos-debrecen-lanyok'

permissions:
  contents: write

concurrency:
  group: hirdetesek-json
  cancel-in-progress: false

jobs:
  frissites:
    runs-on: ubuntu-latest
    steps:
      - name: Repo letöltése
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Függőségek
        run: python -m pip install requests beautifulsoup4
      - name: Oldal feldolgozása
        env:
          LIST_URL: ${{ inputs.url }}
        run: python scripts/rossz.py --url "$LIST_URL"
      - name: JSON mentése a repóba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hirdetesek.json
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Hirdetesek JSON frissites"
            git push
          fi
