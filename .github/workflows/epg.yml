
# ============================================================
#              TVMUSTRA EPG - HIBAJAVITASI NAPLO
# ============================================================
#
# UTOLSO JAVITAS: 2026.10.25.
#
# A RENDSZER CELJA:
# - 17 sajat TV-csatorna musorainak letoltese.
# - A csatornakat a sajat_tvcsatorna_lista.xml tartalmazza.
# - Az epg.xml a teljes letoltott musorlistat tartalmazza.
# - A tv2_esti_musor_szuro.js a deltol kezdodo musorokat
#   a tv2_esti_musor.json fajlba menti.
#
# ------------------------------------------------------------
# 1. HIBA: HTTP 403 FORBIDDEN
# ------------------------------------------------------------
#
# TUNET:
# - Mind a 17 csatorna: 0 programs.
# - ERR: Request failed with status code 403.
#
# OK:
# - A TVmustra elutasitotta az EPGGrabber alapertelmezett
#   User-Agent azonositoval kuldott kereseket.
#
# MEGOLDAS:
# - A tvmustra.hu.config.js konfiguracioba bekerult:
#
#   request: { headers: { 'User-Agent': 'Mozilla/5.0' } },
#
# - Ezt a workflow Python-blokkja automatikusan beilleszti.
# - Az eredmeny: a HTTP 403 hiba megszunt.
#
# ------------------------------------------------------------
# 2. HIBA: HTTP 403 NINCS, DE MEGIS 0 PROGRAMS
# ------------------------------------------------------------
#
# TUNET:
# - A letoltes sikeres, a HTML megerkezik.
# - A generalt epg.xml megis ures.
#
# OK:
# - A TVmustra weboldalan megvaltozott a HTML szerkezete.
# - A regi EPG-feldolgozo nem talalta a musorokat.
#
# REGI HTML KIJELÖLOK:
# - Musorelemek: div[data-page="channel"][data-show]
# - Musorcim:    div[class^="musor_lista_cim"]
# - Kezdes:      div[class^="musor_lista_idopont"]
#
# UJ HTML KIJELÖLOK (2026.10.25.):
# - Musorelemek: .v-prog-container
# - Musorcim:    .v-title
# - Kezdes:      .v-time
#
# MEGOLDAS:
# - A workflow Python-blokkja lecsereli a regi
#   HTML-kijeloloket az uj kijelolokre.
#
# EREDMENY:
# - Mind a 17 csatorna musorai ujra letoltodnek.
# - Az epg.xml es a tv2_esti_musor.json ujra tartalmaz adatokat.
#
# ------------------------------------------------------------
# FONTOS TUDNIVALOK KESOBBI HIBA ESETEN
# ------------------------------------------------------------
#
# 1. Eloszor a GitHub Actions naplot kell ellenorizni.
#
# 2. Ha HTTP 403:
#    Ellenorizni kell a User-Agent fejlecet es a hozzaferest.
#
# 3. Ha 0 programs, de nincs 403:
#    Ellenorizni kell, valtozott-e a TVmustra HTML szerkezete.
#
# 4. Az eredeti feldolgozo helye:
#    epg/sites/tvmustra.hu/tvmustra.hu.config.js
#    (A workflow futas kozben klonozza az iptv-org/epg projektet.)
#
# 5. A --curl kapcsoloval megjelenitheto, milyen HTTP-kerest
#    kuld az EPGGrabber.
#
# 6. A sajat csatornalista es JSON-szuro nem okozta a hibat.
#    Ezeket nem kellett modositani.
#
# 7. A workflow ellenorzi, hogy az epg.xml tartalmaz-e
#    musorokat. Ha ures, nem tolti fel a GitHubra.
#
# ============================================================



name: Generate EPG

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EPG dependencies
        run: |
          cd epg
          npm install

      - name: Generate epg.xml (tvmustra.hu)
        run: |
          cd epg

          python3 - <<'PY'
          from pathlib import Path

          p = Path("sites/tvmustra.hu/tvmustra.hu.config.js")
          s = p.read_text()

          changes = [
              ("days: 2,", "days: 1,"),
              (
                  "div[data-page=\"channel\"][data-show]",
                  ".v-prog-container"
              ),
              (
                  "div[class^=\"musor_lista_cim\"]",
                  ".v-title"
              ),
              (
                 "div[class^=\"musor_lista_idopont\"]",
                  ".v-time"
              ),
              (
                  "start = start.add(1, 'day')",
                  "start = parseStart($item, date.add(1, 'day'))"
              ),
          ]

          for old, new in changes:
              if old not in s:
                  raise RuntimeError(f"Nem talalhato: {old}")
              s = s.replace(old, new, 1)

          s = s.replace(
              "days: 1,",
              "days: 1,\n  request: { headers: { 'User-Agent': 'Mozilla/5.0' } },",
              1
          )

          p.write_text(s)
          print("TVmustra feldolgozo frissitve!")
          PY

          npm run grab --- --channels=../sajat_tvcsatorna_lista.xml --output=../epg.xml

      - name: Ellenorzes - vannak-e musorok
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("epg.xml").getroot()
          programs = root.findall("programme")

          print("Letoltott musorok:", len(programs))

          if not programs:
              raise SystemExit("HIBA: Nincsenek musorok! Az ures XML nem kerul feltoltesre.")
          PY

      - name: Install JSON parser
        run: npm install fast-xml-parser

      - name: Generate TV JSON (MAI adatok)
        run: node tv2_esti_musor_szuro.js

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epg.xml tv2_esti_musor.json
          git commit -m "Update EPG + TV programs" || echo "No changes"
          git pull --rebase origin main
          git push
