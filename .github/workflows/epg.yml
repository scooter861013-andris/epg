
name: Generate EPG

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EPG dependencies
        run: |
          cd epg
          npm install

      - name: Generate epg.xml (tvmustra.hu)
        run: |
          cd epg

          python3 - <<'PY'
          from pathlib import Path

          p = Path("sites/tvmustra.hu/tvmustra.hu.config.js")
          s = p.read_text()

          changes = [
              ("days: 2,", "days: 1,"),
              (
                  "div[data-page=\"channel\"][data-show]",
                  ".v-prog-container"
              ),
              (
                  "div[class^=\"musor_lista_cim\"]",
                  ".v-title"
              ),
              (
                  "div[class^=\"musor_lista_idopont\"]",
                  ".v-time"
              ),
          ]

          for old, new in changes:
              if old not in s:
                  raise RuntimeError(f"Nem talalhato: {old}")
              s = s.replace(old, new, 1)

          s = s.replace(
              "days: 1,",
              "days: 1,\n  request: { headers: { 'User-Agent': 'Mozilla/5.0' } },",
              1
          )

          p.write_text(s)
          print("TVmustra feldolgozo frissitve!")
          PY

          npm run grab --- --channels=../sajat_tvcsatorna_lista.xml --output=../epg.xml

      - name: Ellenorzes - vannak-e musorok
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("epg.xml").getroot()
          programs = root.findall("programme")

          print("Letoltott musorok:", len(programs))

          if not programs:
              raise SystemExit("HIBA: Nincsenek musorok! Az ures XML nem kerul feltoltesre.")
          PY

      - name: Install JSON parser
        run: npm install fast-xml-parser

      - name: Generate TV JSON (MAI adatok)
        run: node tv2_esti_musor_szuro.js

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epg.xml tv2_esti_musor.json
          git commit -m "Update EPG + TV programs" || echo "No changes"
          git pull --rebase origin main
          git push
