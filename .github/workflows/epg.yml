name: Generate EPG

on:
  schedule:
    - cron: "0 1 * * *"   # naponta 03:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone iptv-org/epg
        run: git clone --depth 1 https://github.com/iptv-org/epg.git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EPG dependencies
        run: |
          cd epg
          npm install


      - name: TVmustra kapcsolat teszt
        run: |
          echo "NORMAL CURL:"
          curl -L -s -o /dev/null -w 'HTTP: %{http_code}\n' \
            "https://www.tvmustra.hu/tvmusor/TV2/2026-10-25"

          echo "EPG GRABBER USER-AGENT:"
          curl -L -s -o /dev/null -w 'HTTP: %{http_code}\n' \
            -A 'EPGGrabber/0.48.0 (https://github.com/freearhey/epg-grabber)' \
            "https://www.tvmustra.hu/tvmusor/TV2/2026-10-25"




      - name: Generate epg.xml (tvmusor.hu)
        run: |
          cd epg
          sed -i 's/days: 2,/days: 1,/' sites/tvmustra.hu/tvmustra.hu.config.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sites/tvmustra.hu/tvmustra.hu.config.js")
          s = p.read_text()
          assert "days: 1," in s
          s = s.replace(
              "days: 1,",
              "days: 1,\n  request: { headers: { 'User-Agent': 'Mozilla/5.0' } },",
              1
          )
          p.write_text(s)
          PY

          
          
          node - <<'JS'
          const axios = require('axios')
          const cheerio = require('cheerio')

          axios.get('https://www.tvmustra.hu/tvmusor/TV2/2026-10-25', {
            headers: { 'User-Agent': 'Mozilla/5.0' }
          }).then(r => {
            const html = r.data
            const $ = cheerio.load(html)

            console.log('HTML hossz:', html.length)

            const i = html.search(/19:00|20:00|21:00|18:00/)

            console.log('Esti idopont helye:', i)

            if (i >= 0) {
              console.log('HTML RESZLET:')
              console.log(html.slice(Math.max(0, i - 500), i + 800))
            }

            console.log('Idopontot tartalmazo elemek:')
            $('time').slice(0, 5).each((_, el) => {
              console.log($.html(el).slice(0, 500))
            })
          }).catch(e => console.log('HIBA:', e.message))
          JS





          npm run grab --- --channels=../sajat_tvcsatorna_lista.xml --output=../epg.xml --curl

          
      - name: Install JSON parser
        run: npm install fast-xml-parser

      - name: Generate TV JSON (MAI adatok)
        run: node tv2_esti_musor_szuro.js

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epg.xml tv2_esti_musor.json
          git commit -m "Update EPG + TV programs" || echo "No changes"
          git pull --rebase origin main 
          git push
