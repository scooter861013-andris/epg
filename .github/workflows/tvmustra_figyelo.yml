
name: TVmustra figyelo

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvmustra-figyelo
  cancel-in-progress: false

jobs:
  figyeles:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Konyvtarak telepitese
        run: |
          python -m pip install beautifulsoup4

      - name: TVmustra ellenorzese
        run: |
          python scripts/tvmustra_figyelo.py

      - name: Allapot es naplo mentese
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tvmustra_allapot.json

          if [ -f tvmustra_valtozasok.csv ]; then
            git add tvmustra_valtozasok.csv
          fi

          if ! git diff --cached --quiet; then
            git commit -m "TVmustra figyeles frissitese"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nincs valtozas."
          fi
