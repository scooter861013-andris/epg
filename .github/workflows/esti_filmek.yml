
name: Esti filmek

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  esti_filmek:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Konyvtarak telepitese
        run: |
          python -m pip install requests beautifulsoup4

      - name: TVmustra esti filmek lekerese
        run: |
          python scripts/esti_filmek_scraper.py

      - name: JSON ellenorzese
        run: |
          python - <<'PY'
          import json

          with open("esti_filmek.json", encoding="utf-8") as f:
              adatok = json.load(f)

          filmek = adatok.get("filmek", [])

          if not filmek:
              raise RuntimeError("Nincs film az uj JSON-ban, mentés megszakítva!")

          print(f"Rendben! {len(filmek)} film található.")
          PY

      - name: JSON mentese a GitHubra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add esti_filmek.json

          if ! git diff --cached --quiet; then
            git commit -m "Esti filmek frissitese"
            git push
          else
            echo "Nincs valtozas."
          fi
