
name: Esti filmek

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esti_filmek:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Konyvtarak telepitese
        run: |
          python -m pip install requests beautifulsoup4

      - name: TVmustra esti filmek lekerese
        run: |
          python scripts/esti_filmek_scraper.py
